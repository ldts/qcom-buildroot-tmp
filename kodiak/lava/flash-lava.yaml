# LAVA flash job: loader + kernel (flash-lava)
#
# Companion to `make flash-lava`, which packages the combined loader + kernel
# payload into kodiak/output/kodiak-flash.qcomflash.tar.gz (LUNs 0,1,2,4,
# rootfs NOT included — see the flash-lava target in kodiak.mk). This job
# flashes that tarball to a remote qcs6490-rb3gen2 board via LAVA instead of
# running qdl over local USB.
#
# NOTE — no rootfs.img in this payload. The board boots the freshly flashed
# loader + kernel, but reaching a login prompt needs a rootfs ALREADY present on
# the board's rootfs partition. If the board is bare, the qdl flash still
# passes; only the final login boot will time out. To flash a full,
# self-sufficient image (rootfs included) use flash-lava-yocto.yaml.
#
# path: is NOT set — `make flash-lava` builds a FLAT tarball (files at the
# root: `tar -C $(FLASH_LAVA_DIR) .`), so qdl runs from the tarball root.
#
# Submit + monitor: see README.md in this directory. The <ARTIFACT_URL> and
# <ARTIFACT_TOKEN> below are placeholders — mint them by uploading the tarball
# (LAVA MCP create_artifact_upload, or any lab-reachable HTTPS host) and
# substitute the returned url + token before submitting.

device_type: qcs6490-rb3gen2
job_name: kodiak-flash-lava
priority: medium
# personal: the deploy URL carries the artifact token inline (the MCP could not
# register a named token), so keep the job private.
visibility: personal
timeouts:
  job:
    minutes: 40
  connection:
    minutes: 5
actions:
- deploy:
    to: qdl
    qcomflash:
      url: <ARTIFACT_URL>
      headers:
        Authorization: <ARTIFACT_TOKEN>
    timeout:
      minutes: 25
- boot:
    method: qdl
    firehose_program: prog_firehose_ddr.elf
    # Combined loader (LUNs 1,2,4) + kernel (LUN 0, efi partition only):
    # rawprogram0-only-kernel = efi.bin only; rawprogram4 has the dtb.bin entry
    # stripped (the DTB is embedded in uki.efi). Matches flash-loader + flash-efi
    # together.
    rawprogram: rawprogram0-only-kernel.xml rawprogram1.xml rawprogram2.xml rawprogram4.xml
    patch: patch0.xml
    storage: ufs
    debug: true
    # Capture a DDR crashdump if the board re-enumerates in EDL crashdump mode.
    ramdump: true
    ramdump_timeout: 1800
    timeout:
      minutes: 15
# Optional: confirm the board reaches a Linux login. Only succeeds if a rootfs
# is already on the board (this payload does not flash one). Drop this action
# for a flash-only job. Credentials below are for the Yocto distro; adjust for
# whatever rootfs is actually on the board (e.g. a Buildroot rootfs may present
# a different login prompt and creds).
- boot:
    method: minimal
    auto_login:
      login_prompt: 'login:'
      username: root
      password_prompt: 'Password'
      password: oelinux123
    prompts:
    - 'root@rb3gen2-core-kit'
    - 'root@qcm6490'
    - 'root@(.*):[/~]#'
    timeout:
      minutes: 15
